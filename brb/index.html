<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Be Right Back</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

<div id="app">

  <div class="shell">

    <div class="layout-grid">

      <header class="topbar panel">

        <div class="brand">

          <div class="eyebrow">
            misseos
          </div>

          <h1>
            BE RIGHT BACK
          </h1>

          <p id="subtitle">
            Quick break, back soon 💗
          </p>

        </div>

      </header>

      <section class="left-col">

        <section class="panel reminders-panel">

          <div class="section-kicker">
            Break Time
          </div>

          <h2>
            Reminders
          </h2>

          <div class="reminder-list">

            <div class="reminder-item">
              <span class="icon">✦</span>
              <span>Remember to check in</span>
            </div>

            <div class="reminder-item">
              <span class="icon">▶</span>
              <span>Check out the YouTube</span>
            </div>

            <div class="reminder-item">
              <span class="icon">💧</span>
              <span>Grab some water</span>
            </div>

            <div class="reminder-item">
              <span class="icon">🎵</span>
              <span>Queue up some music</span>
            </div>

          </div>

        </section>

        <section class="panel schedule-panel">

          <div class="section-kicker">
            This Week
          </div>

          <h2>
            Schedule
          </h2>

        </section>

        <section class="panel youtube-panel">

          <div class="section-kicker">
            latest upload
          </div>

          <h2>
            YouTube
          </h2>

          <div class="youtube-inner">

            <div class="youtube-thumb-wrap">
              <img id="youtubeThumb" alt="Latest YouTube thumbnail" />
            </div>

            <div class="youtube-copy">

              <div class="youtube-meta">
                latest video
              </div>

              <div class="youtube-title" id="youtubeTitle">
                Loading latest upload...
              </div>

              <div class="youtube-desc">
                Catch up while I’m away.
              </div>

              <div class="youtube-link">
                !latest
              </div>

            </div>

          </div>

        </section>

        <section class="panel music-panel">

          <div class="section-kicker">
            now playing
          </div>

          <h2>
            Music
          </h2>

          <div class="music-content" id="musicArea"></div>

        </section>

      </section>

      <section class="middle-col"></section>

      <section class="right-col"></section>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
